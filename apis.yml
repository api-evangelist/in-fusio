name: In-Fusio
description: >-
  In-Fusio was a mobile entertainment company founded in 1998 in Bordeaux
  (Merignac), France, and one of the pioneers of the mobile games industry. In
  September 2000 it launched ExEn (Execution Engine), the first Java-based game
  engine dedicated entirely to mobile devices, competing with Sun Microsystems'
  J2ME, and partnered with Motorola on a client-side mobile gaming API for
  faster action and richer graphics. The company published games and community
  services across more than 70 wireless carriers and 140 handsets worldwide,
  with distribution deals including Verizon, Sprint, AT&T, Vodafone, Orange,
  Telefonica Moviles and China Mobile. It split its publishing and distribution
  divisions in January 2006, was acquired by Zenops in May 2007, entered
  administration in 2008, and went into compulsory liquidation in 2009. In-Fusio
  is recorded in the API Evangelist network as a historical portfolio company of
  Insight Partners; it operates no active developer platform or public API
  today.
